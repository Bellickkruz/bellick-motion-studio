<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--cream:#FBF7F0;--deep:#2A0B3D;--royal:#7B2CBF;--electric:#B44CFF;--eInk:#9A2EE6;--lilac:#D7B4F3;--lav:#EDE0FA;--muted:#8A6AA0;}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--cream);font-family:'Poppins',sans-serif;color:var(--deep)}
#bg{position:absolute;inset:0}
#fx{position:absolute;inset:0}
#world{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
svg.layer{position:absolute;left:0;top:0;overflow:visible}
.chip{position:absolute;transform:translateX(-50%);height:56px;padding:0 24px;border-radius:999px;background:#fff;border:2px solid #E6D3F6;box-shadow:0 10px 26px rgba(91,26,140,.10);display:flex;align-items:center;gap:10px;font-size:28px;font-weight:500;white-space:nowrap}
#tile{position:absolute;left:745px;top:935px;width:150px;height:150px;border-radius:36px;overflow:hidden;box-shadow:0 22px 50px rgba(20,10,30,.28)}
#tile img{width:100%;height:100%;display:block}
#tileSheen{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.35) 50%,rgba(255,255,255,0) 65%);background-size:300% 100%;background-position:150% 0}
#tileLbl{position:absolute;left:820px;top:1100px;transform:translateX(-50%);font-size:30px;font-weight:600;color:#0A0A0A}
/* phone */
#phone{position:absolute;left:330px;top:1200px;width:380px;height:570px;border-radius:62px;background:linear-gradient(160deg,#4A1468,#2A0B3D);padding:12px;box-shadow:0 34px 80px rgba(42,11,61,.28);transform-origin:50% 50%}
#screen{position:relative;width:100%;height:100%;border-radius:52px;background:#FFFDFC;overflow:hidden}
#notch{position:absolute;left:50%;top:14px;width:96px;height:26px;border-radius:13px;background:#2A0B3D;transform:translateX(-50%)}
#input{position:absolute;left:18px;right:18px;bottom:22px;height:78px;border-radius:39px;background:#F6EEFB;display:flex;align-items:center;padding:0 10px 0 22px;gap:8px}
#inTxt{flex:1;font-size:27px;font-weight:500;white-space:nowrap;display:flex;align-items:center;position:relative}
.caret{display:inline-block;width:3px;height:30px;background:var(--electric);margin-left:3px;border-radius:2px}
#sendB{width:58px;height:58px;border-radius:50%;background:var(--electric);display:flex;align-items:center;justify-content:center;flex:none}
#sheet{position:absolute;left:0;right:0;bottom:0;height:470px;background:#fff;border-radius:40px 40px 0 0;box-shadow:0 -14px 40px rgba(91,26,140,.14);padding:28px 26px 0;transform:translateY(100%)}
#sheet .grab{width:64px;height:7px;border-radius:4px;background:#E6D3F6;margin:-12px auto 18px}
#sheet .ttl{font-size:30px;font-weight:600}
#sheet .by{font-size:20px;color:var(--muted);margin-top:2px}
#sheet .box{margin-top:16px;border-radius:24px;background:#FAF5FD;border:2px solid #EEDFF8;padding:14px 20px}
#sheet .v{font-size:34px;font-weight:600;display:flex;align-items:center;white-space:nowrap;letter-spacing:-.5px}
#sheet .n{font-size:21px;color:var(--muted);margin-top:4px} #sheet .n b{color:var(--deep);font-weight:500}
#pills{position:relative;height:48px;margin-top:16px}
.pill{position:absolute;left:0;top:0;height:48px;padding:0 20px;border-radius:999px;font-size:22px;font-weight:500;display:flex;align-items:center;gap:9px;white-space:nowrap;opacity:0}
.pill i{width:10px;height:10px;border-radius:50%;background:currentColor;display:block}
.pill.wait{border:2.5px solid var(--electric);color:var(--eInk);background:#fff}
.pill.ok{background:var(--royal);color:#fff}
.pill.sub{background:var(--deep);color:#fff}
#btns{position:absolute;left:24px;right:24px;bottom:26px;display:flex;gap:12px;opacity:0}
.btn{flex:1;height:72px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:600;position:relative;overflow:hidden}
#bDec{border:2.5px solid #DCC3F0;color:var(--muted);background:#fff}
#bApp{background:var(--electric);color:#fff;box-shadow:0 10px 24px rgba(180,76,255,.35)}
#pk{position:absolute;left:0;right:0;bottom:18px;display:flex;flex-direction:column;align-items:center;opacity:0}
#pk .c{font-size:21px;font-weight:500;margin-top:4px}
.arr{display:inline-block;margin:0 8px;flex:none}
/* origami card */
#ocard{position:absolute;left:460px;top:540px;width:360px;height:200px;perspective:900px;opacity:0}
#ocard .pn{position:absolute;top:0;width:120px;height:200px;background:#fff;border:2px solid #E3CCF5;transform-style:preserve-3d;backface-visibility:hidden;overflow:hidden}
#ocard .in{position:absolute;top:0;left:0;width:360px;height:200px;padding:22px 24px}
#ocard .l{font-size:19px;color:var(--muted);font-weight:500}
#ocard .s{margin-top:10px;font-size:34px;font-weight:600;display:flex;align-items:center;white-space:nowrap}
#ocard .r{margin-top:12px;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:20px;background:var(--lav);color:var(--royal);font-size:19px;font-weight:500}
/* market field */
#field{position:absolute;inset:0;opacity:0;background:radial-gradient(800px 700px at 50% 55%,#FFFFFF,#F4ECFA 70%,#EADCF6);overflow:hidden}
#grid{position:absolute;left:540px;top:1060px;width:0;height:0;transform-style:preserve-3d}
.mk{position:absolute;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:34px;background:#fff;border:2px solid #E3CCF5;box-shadow:0 30px 50px rgba(91,26,140,.16);transform-style:preserve-3d;display:flex;align-items:flex-end;justify-content:center;gap:12px;padding-bottom:36px}
.mk b{display:block;width:22px;border-radius:8px;background:#D7B4F3}
.mk.sel{background:linear-gradient(140deg,#C04FE3,#7B2CBF);border-color:#B44CFF}
.mk.sel b{background:rgba(255,255,255,.85)}
#fsvg{position:absolute;left:0;top:0;overflow:visible}
#routeChip{position:absolute;transform:translate(-50%,-100%);height:58px;padding:0 24px;border-radius:999px;background:var(--deep);color:#fff;font-size:28px;font-weight:600;display:flex;align-items:center;gap:10px;opacity:0;white-space:nowrap}
#white{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
/* captions */
#cap{position:absolute;left:60px;right:60px;top:200px;height:260px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center;font-size:96px;font-weight:700;line-height:1.08;letter-spacing:-2px;perspective:800px}
#cap span{display:inline-block;margin:0 14px;color:var(--deep);transform-origin:50% 100%;position:relative}
#cap span.on{color:var(--eInk)}
#flyers{position:absolute;inset:0;pointer-events:none}
.flyer{position:absolute;font-size:96px;font-weight:700;letter-spacing:-2px;color:var(--eInk);transform-origin:0 0;white-space:nowrap}
#uline{position:absolute;left:0;top:0;overflow:visible}
#foot{position:absolute;left:0;right:0;top:1808px;text-align:center;font-size:22px;color:#A48BB4}
#cursor{position:absolute;left:0;top:0;width:56px;height:56px;opacity:0;filter:drop-shadow(0 6px 10px rgba(42,11,61,.3))}
#wave{position:absolute;left:0;top:0;width:10px;height:10px;border-radius:50%;border:6px solid rgba(180,76,255,.7);opacity:0;transform:translate(-50%,-50%)}
/* end */
#endbg{position:absolute;inset:0;opacity:0;background:radial-gradient(700px 600px at 15% 90%, rgba(215,180,243,.45), rgba(215,180,243,0) 70%),radial-gradient(700px 600px at 90% 8%, rgba(237,224,250,.9), rgba(237,224,250,0) 70%),#FBF7F0}
#eTile{position:absolute;left:410px;top:500px;width:260px;height:260px;border-radius:60px;overflow:hidden;box-shadow:0 30px 70px rgba(20,10,30,.25);opacity:0}
#eTile img{width:100%;height:100%;display:block}
#eSheen{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.45) 50%,rgba(255,255,255,0) 60%);background-size:300% 100%;background-position:160% 0}
#eWord{position:absolute;left:0;right:0;top:800px;text-align:center;font-size:130px;font-weight:600;letter-spacing:-3px;color:#0A0A0A;opacity:0}
#eTag{position:absolute;left:40px;right:40px;top:990px;text-align:center;font-size:64px;font-weight:500;line-height:1.2;letter-spacing:-.5px;opacity:0}
#eTag em{font-style:normal;color:var(--eInk)}
#eCredit{position:absolute;left:0;right:0;top:1320px;display:flex;justify-content:center;align-items:center;gap:16px;font-size:32px;color:var(--muted);opacity:0}
#eCredit img{width:58px;height:58px;border-radius:50%} #eCredit b{font-weight:500;color:var(--deep)}
#eAd{position:absolute;right:70px;top:1700px;font-size:28px;font-weight:500;color:var(--muted);opacity:0}
</style></head><body>

<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,s,d)=>clamp((t-s)/d);
const lerp=(a,b,x)=>a+(b-a)*x;
const eOut=x=>1-Math.pow(1-x,3);
const eIn=x=>x*x*x;
const eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eBack=x=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const NS='http://www.w3.org/2000/svg';
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,x)=>a.map((v,i)=>Math.round(v+(b[i]-v)*x));
let seed=5;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
const WORDS=__WORDS__;
const T_END=15.5;
/* ---------- timeline constants ---------- */
const T={type0:0.0,type1:0.95,send:1.05,fly0:1.1,wake:1.9,beam:2.25,dive0:2.6,dive1:3.1,fieldEnd:4.85,out1:5.55,ret0:5.5,ret1:5.95,ori0:5.95,ori1:6.65,drop0:6.7,drop1:7.35,sheet:7.3,freeze:7.4,btn:8.72,tap:10.85,approved:11.5,submitted:11.95,endT:12.45};
/* ---------- gem ---------- */
const AG={x:300,y:740};
const PH=(1+Math.sqrt(5))/2;
const V=[];[[0,1,PH],[1,PH,0],[PH,0,1]].forEach(b=>{for(const s1 of [1,-1])for(const s2 of [1,-1]){const v=b.slice();let k=0;for(let i=0;i<3;i++){if(v[i]!==0){v[i]*=(k===0?s1:s2);k++;}}V.push(v.map(x=>x/Math.hypot(1,PH)));}});
let F=[];const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);const E=2/Math.hypot(1,PH);
for(let i=0;i<12;i++)for(let j=i+1;j<12;j++)for(let k=j+1;k<12;k++){if([dist(V[i],V[j]),dist(V[j],V[k]),dist(V[i],V[k])].every(d=>Math.abs(d-E)<1e-3))F.push([i,j,k]);}
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const norm=a=>{const l=Math.hypot(...a);return a.map(v=>v/l)};
F=F.map(f=>{const n=cross(sub(V[f[1]],V[f[0]]),sub(V[f[2]],V[f[0]]));const c=[0,1,2].map(i=>(V[f[0]][i]+V[f[1]][i]+V[f[2]][i])/3);return dot(n,c)<0?[f[0],f[2],f[1]]:f;});
const facesEl=F.map(()=>{const p=document.createElementNS(NS,'polygon');p.setAttribute('stroke-linejoin','round');p.setAttribute('stroke-width','3');$('gem').appendChild(p);return p;});
const C0=hex('#3A0E63'),C1=hex('#7B2CBF'),C2=hex('#EAD3FA');const LT=norm([-0.45,0.75,0.6]);
function drawGem(ang,cy,scale,explode){
  const R=112*scale,tilt=0.38+Math.sin(ang*0.5)*0.12;
  const rot=v=>{let [x,y,z]=v;let x1=x*Math.cos(ang)+z*Math.sin(ang),z1=-x*Math.sin(ang)+z*Math.cos(ang);let y2=y*Math.cos(tilt)-z1*Math.sin(tilt),z2=y*Math.sin(tilt)+z1*Math.cos(tilt);return [x1,y2,z2];};
  const RV=V.map(rot);
  const list=F.map(f=>{const a=RV[f[0]],b=RV[f[1]],c=RV[f[2]];const n=norm(cross(sub(b,a),sub(c,a)));return {f,n,z:(a[2]+b[2]+c[2])/3};}).sort((p,q)=>p.z-q.z);
  list.forEach((o,k)=>{const el=facesEl[k];if(o.n[2]<=0.02&&explode<0.05){el.setAttribute('points','');return;}
    if(o.n[2]<=-0.2){el.setAttribute('points','');return;}
    const I=clamp(0.18+0.95*Math.max(0,dot(o.n,LT)));const col=I<.55?mix(C0,C1,I/.55):mix(C1,C2,(I-.55)/.45);
    const c=`rgb(${col})`;el.setAttribute('fill',c);el.setAttribute('stroke',c);
    const off=o.n.map(v=>v*explode);
    el.setAttribute('points',o.f.map(j=>`${AG.x+(RV[j][0]+off[0])*R},${cy-(RV[j][1]+off[1])*R}`).join(' '));});
}
function gemSpeed(t){let s=0.45;s=lerp(s,2.4,eIO(P(t,1.9,0.5)));s=lerp(s,0,eIO(P(t,T.freeze,0.5)));s=lerp(s,0.4,eIO(P(t,T.tap+0.3,0.8)));return s;}
const ANG=[];{let a=0.3;for(let i=0;i<=T_END*120+2;i++){ANG.push(a);a+=gemSpeed(i/120)/120;}}
const gemAngle=t=>ANG[Math.min(ANG.length-1,Math.max(0,Math.round(t*120)))];
/* ambient particle clock (freezes during the pause) */
function pSpeed(t){return 1-eIO(P(t,T.freeze,0.45))*(1-eIO(P(t,T.tap+0.1,0.6)));}
const PC=[];{let a=0;for(let i=0;i<=T_END*120+2;i++){PC.push(a);a+=pSpeed(i/120)/120;}}
const pclock=t=>PC[Math.min(PC.length-1,Math.max(0,Math.round(t*120)))];
const parts=[];for(let i=0;i<34;i++){const c=document.createElementNS(NS,'circle');$('fx').appendChild(c);parts.push({c,x:rnd()*1080,y:rnd()*1920,r:3+rnd()*9,vy:-(14+rnd()*30),ph:rnd()*6.28,col:['#D7B4F3','#B44CFF','#EDE0FA','#C99AF0'][i%4],o:.25+rnd()*.45});}
/* comets */
const comets=[];for(let k=0;k<4;k++){const g=document.createElementNS(NS,'g');g.innerHTML='<circle r="16" fill="#B44CFF" filter="url(#b6)"/><circle r="8" fill="#fff"/>';$('comets').appendChild(g);comets.push(g);}
const at=(id,u)=>{const p=$(id);return p.getPointAtLength(p.getTotalLength()*clamp(u));};
/* prompt text + flying letters */
const PROMPT='Swap USDC → SOL';
const chars=[...PROMPT];
const flyEls=chars.map(ch=>{const t=document.createElementNS(NS,'text');t.textContent=ch===' '?'':ch;t.setAttribute('font-family','Poppins');t.setAttribute('font-size','27');t.setAttribute('font-weight','600');t.setAttribute('fill','#2A0B3D');$('fly').appendChild(t);return t;});
let charPos=null;
function measureChars(){ $('inTxt').innerHTML=chars.map((c,i)=>`<span id="ch${i}">${c===' '?'&nbsp;':c}</span>`).join('');
  charPos=chars.map((c,i)=>{const r=$('ch'+i).getBoundingClientRect();return {x:r.left,y:r.top+r.height*0.78};}); }
